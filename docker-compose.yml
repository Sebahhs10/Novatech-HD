version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: novatech-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: novatech_db
      MYSQL_USER: novatech_user
      MYSQL_PASSWORD: novatech_password123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - novatech-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novatech-app
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_USER: novatech_user
      DB_PASSWORD: novatech_password123
      DB_NAME: novatech_db
    ports:
      - "8080:3000"
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - novatech-net

volumes:
  mysql_data:

networks:
  novatech-net:
    driver: bridge

