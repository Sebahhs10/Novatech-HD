name: CI/CD Pipeline - NovaTech

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: 🧪 Pruebas Unitarias (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar codigo del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar entorno Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🚀 Ejecutar suite de pruebas
        run: |
          echo "Ejecutando pruebas de integridad en pedidos e inventario..."
          node tests/test.js

  docker-build:
    name: 🐳 Construccion y Validacion Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar codigo del repositorio
        uses: actions/checkout@v4

      - name: 🔨 Construir imagen Docker
        run: |
          echo "Construyendo imagen Docker unificada..."
          docker build -t novatech-app:latest .
          docker images

      - name: 🚀 Desplegar contenedor de prueba
        run: |
          echo "Levantando contenedor en el puerto 8080 (mapeado al 3000 interno)..."
          docker run -d -p 8080:3000 --name novatech-container novatech-app:latest
          docker ps
          sleep 5

      - name: 🩺 Healthcheck de la aplicacion
        run: |
          echo "Verificando disponibilidad de la aplicacion en http://localhost:8080..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
          echo "Codigo de respuesta HTTP obtenido: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Error: La aplicacion no respondio con estado HTTP 200 (recibido: $HTTP_STATUS)"
            docker logs novatech-container
            exit 1
          fi
          echo "✅ Aplicacion NovaTech desplegada y respondiendo con exito (HTTP 200)."

      - name: 🧹 Limpiar recursos de contenedor
        if: always()
        run: |
          echo "Deteniendo y eliminando contenedor de prueba..."
          docker stop novatech-container || true
          docker rm novatech-container || true
