name: CI/CD Pipeline - NovaTech

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. INTEGRACIÓN CONTINUA (CI)
  test:
    name: 🧪 CI - Pruebas Unitarias (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar codigo del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar entorno Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🚀 Ejecutar suite de pruebas
        run: |
          echo "Ejecutando pruebas de integridad en pedidos e inventario..."
          node tests/test.js

  # 2. ENTREGA CONTINUA (CD)
  docker-build:
    name: 🐳 CD - Construccion, Despliegue y Validacion Docker
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: 📥 Clonar codigo del repositorio
        uses: actions/checkout@v4

      - name: 🔨 Construir imagen Docker
        run: |
          docker build -t novatech-app:latest .
          docker images

      - name: 🚀 Desplegar contenedor de prueba
        run: |
          docker run -d -p 8080:80 --name novatech-container novatech-app:latest
          docker ps
          sleep 4

      - name: 🩺 Healthcheck de la aplicacion
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
          echo "Codigo de respuesta HTTP: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Error: La aplicacion no respondio con estado HTTP 200"
            exit 1
          fi
          echo "✅ Aplicacion NovaTech desplegada y respondiendo con exito."

      - name: 🧹 Limpiar recursos de contenedor
        if: always()
        run: |
          docker stop novatech-container || true
          docker rm novatech-container || true