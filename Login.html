<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaTech - Acceso Administrativo</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<main class="login-shell">
  <section class="login-card">
    <div class="login-brand">
      <div class="brand-icon">N</div>
      <div><strong>NovaTech</strong><span>Portal de gestión</span></div>
    </div>
    <div class="login-heading">
      <span class="eyebrow">ÁREA RESTRINGIDA</span>
      <h1>Acceso administrativo</h1>
      <p>Ingresa tus credenciales para acceder al panel de gestión.</p>
    </div>
    <form id="loginForm" class="login-form">
      <label for="username">Usuario</label>
      <div class="input-wrap"><span>👤</span><input id="username" name="username" type="text" autocomplete="username" placeholder="Ingresa tu usuario" required></div>
      <label for="password">Contraseña</label>
      <div class="input-wrap"><span>🔒</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required><button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">👁️</button></div>
      <button class="login-button" type="submit">Iniciar sesión <span>→</span></button>
      <p id="loginError" class="login-error" role="alert"></p>
    </form>
    <div class="login-footer"><span class="dot"></span> Sistema protegido · NovaTech S.A.C.</div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
